name: PR Checks

on:
  pull_request:
    branches:
      - release
      - develop
      - main

jobs:
  ruff:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-ruff.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
  
  mypy:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-mypy.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
    with:
      mypy-target: app

  tests:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-test.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
    with:
      coverage-source: app
      coverage-min: 90

  notify:
    needs: [ruff, tests, mypy]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    uses: RideTrip-tour/ci-templates/.github/workflows/telegram-notify.yml@7cd4ef9d2c2d3e28bf6694fec0629caaf0b803f6
    with:
      service-name: ${{ vars.AUTH_SERVICE_NAME || 'gateway-service' }}
      environment: DEV
      swarm-service: ${{ vars.AUTH_SWARM_SERVICE || 'gate_gateway-service' }}
      results-json: ${{ toJSON(needs) }}
    secrets: inherit
