name: CI Dev

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  ruff:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-ruff.yml@1ea20e0f3eef0c509201b91ee307a5be4d0ea489
  
  mypy:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-mypy.yml@1ea20e0f3eef0c509201b91ee307a5be4d0ea489
    with:
      mypy-target: app

  tests:
    uses: RideTrip-tour/ci-templates/.github/workflows/python-test.yml@1ea20e0f3eef0c509201b91ee307a5be4d0ea489
    with:
      coverage-source: app
      coverage-min: 90

  build:
    needs: [ruff, tests, mypy]
    if: github.event_name == 'push'
    uses: RideTrip-tour/ci-templates/.github/workflows/docker-build-push.yml@1ea20e0f3eef0c509201b91ee307a5be4d0ea489
    with:
      namespace: ${{ vars.DOCKERHUB_NAMESPACE || 'ride2trip' }}
      service-name: ${{ vars.SERVICE_GATEWAY_NAME || 'gateway-service' }}
      tag-prefix: dev
    secrets: inherit


  deploy:
    needs: [build]
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-deploy.yml@1ea20e0f3eef0c509201b91ee307a5be4d0ea489
    with:
      image-ref: ${{ needs.build.outputs.image_ref }}
      swarm-service: ${{ vars.GATEWAY_SWARM_SERVICE || 'apps_gateway-service' }}
      environment: DEV
    secrets: inherit

  healthcheck:
    needs: deploy
    uses: RideTrip-tour/ci-templates/.github/workflows/swarm-healthcheck.yml@1ea20e0f3eef0c509201b91ee307a5be4d0ea489
    with:
      service-name: ${{ vars.SERVICE_GATEWAY_NAME || 'gateway-service' }}
      app-name: ${{ vars.APP_NAME || 'gateway' }}
      data-network: ${{ vars.DATA_NETWORK || 'data-network' }}
      environment: DEV
    secrets: inherit

  notify:
    needs: [ruff, tests, mypy, build, deploy, healthcheck]
    if: ${{ always() && (github.event_name == 'push' || contains(needs.*.result, 'failure')) }}
    uses: RideTrip-tour/ci-templates/.github/workflows/telegram-notify.yml@1ea20e0f3eef0c509201b91ee307a5be4d0ea489
    with:
      service-name: ${{ vars.SERVICE_GATEWAY_NAME || 'gateway-service' }}
      environment: DEV
      swarm-service: ${{ vars.AUTH_SWARM_SERVICE || 'gate_gateway-service' }}
      results-json: ${{ toJSON(needs) }}
      image-ref: ${{ needs.build.outputs.image_ref }}
    secrets: inherit