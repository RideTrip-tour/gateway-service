name: CI Dev

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'ride2trip' }}
  GATEWAY_SWARM_SERVICE: ${{ vars.GATEWAY_SWARM_SERVICE || 'gate_gateway-service' }}

jobs:
  lint_test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.test.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.test.txt
          python -m pip install ruff

      - name: Lint (ruff)
        run: ruff check --select F,E9 .

      - name: Tests (pytest)
        run: pytest -q

  build_push:
    runs-on: ubuntu-latest
    needs:
      - lint_test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image ref
        id: image
        run: |
          image_ref="${DOCKERHUB_NAMESPACE}/gateway-service:dev-${GITHUB_SHA::7}"
          echo "GATEWAY_IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Build and push gateway-service
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.DOCKERHUB_NAMESPACE }}/gateway-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_push
    if: github.event_name == 'push'
    environment: DEV
    steps:
      - name: Compute image ref
        run: echo "GATEWAY_IMAGE_REF=${DOCKERHUB_NAMESPACE}/gateway-service:dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -H "${{ secrets.SWARM_HOST }}" >> ~/.ssh/known_hosts

      - name: Create docker context
        run: |
          docker context create swarm --docker "host=ssh://${{ secrets.SWARM_USER }}@${{ secrets.SWARM_HOST }}"
          docker --context swarm info

      - name: Update gateway service
        run: |
          set -euo pipefail
          docker --context swarm service update \
            --with-registry-auth \
            --detach=false \
            --image "$GATEWAY_IMAGE_REF" \
            "$GATEWAY_SWARM_SERVICE"
